[package]
name = "silph-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "silph monitoring server: scrapes collectors, stores and serves metrics"

[features]
default = ["dashboard"]
dashboard = []

[dependencies]
silph-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
humantime-serde = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
reqwest = { workspace = true }
rusqlite = { workspace = true }
tsz = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
silph-collector = { path = "../silph-collector" }
tempfile = { workspace = true }
# hooks: commit-abort injection in storage tests only; prod builds stay hooks-free.
rusqlite = { workspace = true, features = ["hooks"] }
