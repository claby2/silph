# silph-server configuration

# Address to listen on (query API + dashboard).
listen = "0.0.0.0:8080"

# Directory for the time-series database.
data_dir = "./data"

scrape_interval = "15s"
scrape_timeout = "5s"

# Data older than this is expired.
retention = "30d"

# One entry per monitored host.
[[targets]]
name = "example-host"
url = "http://127.0.0.1:9100"
token = "change-me"
